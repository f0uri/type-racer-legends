<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدٍّ في Type Racer Legends</title>
<style>body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#0b0f1e;color:#fff;text-align:center;padding:40px 20px}
h1{color:#00e5ff}.card{background:#151b33;border-radius:18px;padding:20px;margin:20px auto;max-width:420px}
a.b{display:block;margin:12px auto;padding:14px;border-radius:14px;background:#00e5ff;color:#000;font-weight:800;text-decoration:none;max-width:320px}a.s{background:transparent;border:2px solid #ff2bd6;color:#ff2bd6}
p{color:#9aa4c7}.big{font-size:40px;color:#ffd166;font-weight:900}</style></head>
<body><h1>تحدٍّ جديد!</h1>
<div class="card"><p id="who">صديقك يتحداك</p><div class="big" id="wpm"></div><p>كلمة في الدقيقة — هل تستطيع تجاوزه؟</p></div>
<a class="b" id="open" href="#">افتح في اللعبة</a>
<a class="b s" id="dl" href="https://github.com/f0uri/type-racer-legends/releases/latest">ليس لديك اللعبة؟ نزّلها الآن</a>
<script>
var q=location.search, p=new URLSearchParams(q);
document.getElementById('wpm').textContent=(p.get('w')||'?')+' WPM';
if(p.get('n'))document.getElementById('who').textContent=p.get('n')+' يتحداك!';
var app='typeracerlegends://challenge'+q;
document.getElementById('open').href=app;
fetch('../version.json').then(r=>r.json()).then(v=>{if(v.apkUrl)document.getElementById('dl').href=v.apkUrl}).catch(function(){});
setTimeout(function(){location.href=app},400);
</script></body></html>
