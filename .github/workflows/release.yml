name: Release (tag v*)

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          IFS='.' read -r MA MI PA <<< "${NAME%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "VERSION_NAME=$NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "Version $NAME ($CODE)"
      - name: Prepare Firebase + signing (optional)
        run: |
          [ -n "$GOOGLE_SERVICES_JSON" ] && echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json || echo "no google-services secret"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=app/release.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
          fi
      - run: flutter pub get
      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compose dart-defines
        run: |
          D=""
          [ -n "$ADMOB_REWARDED_ID" ] && D="$D --dart-define=ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID"
          [ -n "$ADMOB_INTERSTITIAL_ID" ] && D="$D --dart-define=ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"
          echo "DEFINES=$D" >> $GITHUB_ENV
      - name: Build APK + AAB
        run: |
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE" $DEFINES
          flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE" $DEFINES
      - name: Package artifacts + version.json
        run: |
          mkdir -p dist
          APK="dist/TypeRacerLegends-${VERSION_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TypeRacerLegends-${VERSION_NAME}.aab"
          python3 tools/make_version_json.py "$APK" "$VERSION_NAME" "$VERSION_CODE" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
            version.json
          generate_release_notes: true
          body_path: RELEASE_NOTES_AR.md
      - name: Commit version.json
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): version.json for ${GITHUB_REF_NAME} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
      - name: Publish version.json + content to GitHub Pages
        # the github-pages environment only accepts deployments from main, so dispatch the pages workflow on main
        # (workflow_dispatch is allowed with GITHUB_TOKEN, unlike push events caused by it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
