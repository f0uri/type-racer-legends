name: Build (analyze, test, APK + AAB)

on:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'README.md', 'TODO_MANUAL.md', 'version.json', 'site/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Validate content JSON
        run: python3 tools/build_content.py
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: flutter test --reporter expanded

  build:
    name: Build APK + AAB
    needs: check
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Firebase config (optional)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json created from secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building in guest/offline mode"
          fi
      - name: Prepare signing (optional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=app/release.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
            echo "Release keystore configured"
          else
            echo "No keystore secrets: APK will be signed with the debug key (not for the Play Store)"
          fi
      - run: flutter pub get
      - name: Compose dart-defines
        run: |
          D=""
          [ -n "$ADMOB_REWARDED_ID" ] && D="$D --dart-define=ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID"
          [ -n "$ADMOB_INTERSTITIAL_ID" ] && D="$D --dart-define=ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"
          echo "DEFINES=$D" >> $GITHUB_ENV
      - name: Build APK
        run: flutter build apk --release $DEFINES
      - name: Build AAB
        run: flutter build appbundle --release $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: type-racer-legends-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: type-racer-legends-aab
          path: build/app/outputs/bundle/release/app-release.aab

  firebase-plugin-check:
    name: Gradle check with Firebase plugins enabled (dummy config)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"dummy-check","storage_bucket":"dummy-check.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"com.typeracerlegends.game"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyDummyDummyDummyDummyDummy0000"}],
           "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - run: flutter pub get
      - name: Build debug APK with Firebase Gradle plugins
        run: flutter build apk --debug
